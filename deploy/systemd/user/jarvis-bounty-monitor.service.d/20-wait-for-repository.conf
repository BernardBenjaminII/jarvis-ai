ExecStartPre=/usr/bin/timeout 180 /usr/bin/bash -c 'until test -f /mnt/jarvis_data/Projects/jarvis-ai/core/bounty_catalog/scheduled_monitor_r100d2.py; do sleep 3; done'
TimeoutStartSec=1500
